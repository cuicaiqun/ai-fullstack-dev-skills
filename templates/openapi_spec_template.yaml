openapi: 3.0.3
info:
  title: Project API
  version: 0.1.0
servers:
  - url: http://localhost:3000/api
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          nullable: true
security:
  - bearerAuth: []
