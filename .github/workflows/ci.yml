name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/code/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: project/code/python/requirements.txt
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      - name: P0-3 production compose / secrets gate
        run: python scripts/check_p0_3_deploy.py
      - name: P1-3 alert gate (unit)
        run: python -m pytest tests/test_check_alerts.py -q
      - name: Unit tests
        env:
          REQUIRE_OPENAI_API_KEY: "false"
          UPDATE_MODE: "off"
          AUTH_ENABLED: "true"
          STATE_STORE_DSN: ""
          INGEST_QUEUE: local
          APP_ENV: development
          REQUIRE_STRONG_SECRETS: "false"
          DISABLE_LOCAL_EMBEDDINGS: "1"
          WALL_TIMEOUT: "600"
        run: bash scripts/run_unit_tests.sh
