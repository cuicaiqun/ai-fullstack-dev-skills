# P0-3 local TLS terminator (self-signed).
# Usage (from code/):
#   bash scripts/gen_selfsigned_tls.sh
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.tls.yml --env-file python/.env up -d tls
#
# Then: curl -k https://127.0.0.1:8443/api/health

services:
  tls:
    image: nginx:1.27-alpine
    container_name: agenthub-tls
    ports:
      - "8443:8443"
    volumes:
      - ./tls/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls/server.crt:/etc/nginx/certs/server.crt:ro
      - ./tls/server.key:/etc/nginx/certs/server.key:ro
    depends_on:
      - api
    networks:
      - agenthub
